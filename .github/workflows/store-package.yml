name: store-package

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same check release.yml runs. On 2026-09-23 a v1.8.0 tag pushed at a
      # 1.7.0 commit packaged and uploaded a Store .appx stamped 1.7.0.0 while
      # release.yml alone failed; a manual run has no tag to compare.
      - name: tag must match package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      # A --release build: minified, debug hook off, version stamped into the
      # footer. The plain `npm run build` writes the dev file, which
      # prepare-app used to accept silently -- every .appx before this shipped
      # the dev HTML with an empty version footer.
      - name: build the app file
        run: |
          npm ci
          npm run build -- --release

      - name: install the store shell
        working-directory: store
        run: npm ci

      - name: package the appx
        working-directory: store
        # BC_IDENTITY_NAME / BC_PUBLISHER / BC_PUBLISHER_DISPLAY_NAME are
        # repository VARIABLES (public manifest values, not secrets).
        #
        # The :submission target passes --require-identity, so a missing or
        # empty variable FAILS this step instead of quietly falling back to the
        # placeholders committed in electron-builder.json. Actions reads
        # variables at run time, so a run started before a variable was added
        # sees nothing -- and a placeholder Identity/Publisher is only caught on
        # upload, after the artifact looks finished. Fail here instead.
        run: npm run dist:appx:submission
        env:
          BC_IDENTITY_NAME: ${{ vars.BC_IDENTITY_NAME }}
          BC_PUBLISHER: ${{ vars.BC_PUBLISHER }}
          BC_PUBLISHER_DISPLAY_NAME: ${{ vars.BC_PUBLISHER_DISPLAY_NAME }}

      - name: verify the built appx manifest
        # Reads AppxManifest.xml out of the .appx electron-builder just wrote
        # and fails the run if it doesn't match what was supposed to ship
        # (wrong/unstamped version, leftover placeholder identity, or
        # maintainer jargon in the Store-facing Description) -- the same two
        # defects that have previously reached a real artifact and were only
        # caught by a human unzipping it by hand. Runs before the upload step
        # on purpose: an upstream gate here means a bad manifest never
        # produces an artifact that looks finished.
        working-directory: store
        shell: bash
        run: |
          appx=$(ls release/*.appx)
          node scripts/verify-appx.mjs "$appx"

      # The Store's certification run was the first launch of v1.3.0-v1.6.0,
      # and it crashed on every device. Run the packaged exe (the same
      # app.asar the .appx carries) before anything is uploaded. A
      # main-process crash leaves an error dialog open, so not exiting in
      # time is a failure.
      - name: launch the packaged app (must load the page and exit 0)
        working-directory: store
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/Band Coach.exe'
          if (-not (Test-Path $exe)) { throw "no packaged exe at $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) {
            Stop-Process -Id $p.Id -Force
            throw 'the packaged app did not exit within 90s (a launch crash leaves an error dialog open)'
          }
          if ($p.ExitCode -ne 0) { throw "the packaged app's smoke check exited $($p.ExitCode) (see store/lib/smoke.js)" }

      # Partner Center runs the Windows App Certification Kit on every
      # submission. Run it here first, on a signed copy of the same .appx,
      # and fail before upload on a FAIL report (WARNING = only optional
      # tests failed, which the Store accepts). scripts/run-wack.ps1 says
      # why it has to sign a copy.
      - name: run the Windows App Certification Kit
        working-directory: store
        shell: pwsh
        run: |
          $appx = (Get-ChildItem release/*.appx | Select-Object -First 1).FullName
          ./scripts/run-wack.ps1 -Appx $appx -Report "$PWD/wack/wack-report.xml"
          node scripts/wack-verdict.mjs wack/wack-report.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: upload the WACK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wack-report
          path: store/wack/
          if-no-files-found: ignore

      - name: upload appx artifact
        uses: actions/upload-artifact@v4
        with:
          name: band-coach-appx
          path: store/release/*.appx
          if-no-files-found: error
