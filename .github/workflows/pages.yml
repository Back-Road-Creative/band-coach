name: pages

# Triggered by the TAG PUSH, not by `release: published`. release.yml creates
# the release with GITHUB_TOKEN, and GitHub deliberately does not fire
# workflow triggers for events created with that token — so a
# `release: published` trigger here could never run, and never did.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The same check release.yml runs: on 2026-09-23 a v1.8.0 tag pushed at
      # a 1.7.0 commit deployed Pages live with version.json saying 1.7.0
      # while release.yml alone failed. A manual run has no tag to compare.
      - name: tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/pages

  # release.yml is the only tag workflow that runs the test suite and the
  # release gate. Without this job a tag on a red commit still deploys the live Pages build,
  # because the build here only proves it built. This waits for release.yml's
  # run for the SAME commit to finish and fails unless it succeeded; a run
  # that has not appeared yet is given time to (all three workflows start on
  # the same tag push) and is matched by tag name as well as commit, so an
  # older green tag on the same commit does not stand in for this one. The
  # budget matches release.yml's 30 minute job limit plus its queue time. A
  # manual run on a branch has no tag run to wait for, so the deploy below is
  # tag-only: a branch run builds the site but never publishes it.
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    steps:
      - name: wait for release.yml to pass for this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 70); do
            if runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --event push --limit 20 --json status,conclusion)"; then
              verdict="$(printf '%s' "$runs" | jq -r 'if any(.[]; .conclusion == "success") then "pass" elif length == 0 or any(.[]; .status != "completed") then "wait" else "fail" end')" || verdict=wait
            else
              verdict=wait
            fi
            case "$verdict" in
              pass) echo "release.yml passed for $GITHUB_SHA"; exit 0 ;;
              fail) echo "release.yml did not pass for $GITHUB_SHA, so the Pages deploy is blocked. Once release.yml passes for this tag, re-run this workflow's failed jobs (re-running release.yml alone does not re-trigger this one), or push a fixed commit and a new tag." >&2; exit 1 ;;
            esac
            echo "waiting for release.yml for $GITHUB_SHA (attempt $attempt)"
            sleep 30
          done
          echo "release.yml never finished for $GITHUB_SHA within the wait, so the Pages deploy is blocked. Once release.yml passes for this tag, re-run this workflow's failed jobs, or push a fixed commit and a new tag." >&2
          exit 1

  deploy:
    needs: [build, release-gate]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
