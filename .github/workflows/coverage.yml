name: coverage

# Unit-test coverage of src/core, src/song and src/audio, once a week and on
# demand, with a line-coverage floor on src/core (tests/unit/coverage-floor.mjs).
# A separate file from ci.yml on purpose: bin/autoland.py counts every ci.yml
# run on a commit whatever its event, so a `schedule` trigger there would feed
# the merge barrier. Separate from weekly-current-browser.yml too: that one runs
# the browser suite on the newest Chrome; this one only reports coverage. The
# lcov file is kept as an artifact so the numbers can be read per file.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # A few unit tests start Chrome, as in ci.yml's test job.
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci
      # Some unit tests read the built page, as in ci.yml (npm test's pretest).
      - run: node build/build.mjs
      - name: unit coverage, then the src/core floor
        run: npm run coverage
      - name: keep the lcov report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

  # One issue, not one per red week. needs.coverage.result, not failure(): this
  # job's own steps do not fail when the coverage job did. A cancelled run opens
  # nothing. Same approach as the report job in weekly-current-browser.yml.
  notify:
    needs: [coverage]
    if: always() && needs.coverage.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: open or update the failing-run issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='weekly coverage run failing'
          body="The weekly coverage run failed. Either unit-test coverage fell below a floor in tests/unit/coverage-floor.mjs, or the run itself broke.

          Run: $RUN_URL

          Open the run for the floor message, and download its lcov artifact to read the numbers per file."
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
