name: release

on:
  push:
    tags:
      - 'v*'
  # A dispatch run is a dry run: it builds, runs the suite (with its posttest
  # release lane) and records the tested-file hash, but every step that needs a
  # tag or has an outside effect is guarded by
  # `github.event_name == 'push' && github.ref_type == 'tag'`, so it publishes
  # and notifies nothing. pages.yml and store-package.yml count only
  # `--event push` runs of this workflow, and release-consistency.yml ignores a
  # non-push run; tests/unit/release-dry-run.test.mjs pins all three.
  workflow_dispatch:

# Read-only by default: the install and test steps run with a token that cannot write.
# The one job that publishes asks for more, on itself (a job split would break
# the adjacency pins in tests/unit/release-workflow-budget-evidence.test.mjs).
# tests/unit/release-workflow-security.test.mjs pins both.
permissions:
  contents: read
  actions: read

jobs:
  # pages.yml and store-package.yml wait for this workflow's run on the same
  # commit to succeed (their release-gate job) before they deploy or package;
  # tests/unit/tag-deploys-wait-for-release-run.test.mjs pins that.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # Only the attest step below uses these two.
      id-token: write
      attestations: write
    # This job runs the same two release-lane runs as ci.yml (here: the suite,
    # whose posttest runs the gate, then the gate again; ci.yml runs the gate
    # first), so its budget must stay at or above ci.yml's;
    # tests/unit/release-workflow-budget-evidence.test.mjs pins that, so a
    # later rise in ci.yml must be followed here. Ten passing
    # ci.yml runs of this work on 2026-10-02 took 12.9-15.0 min on
    # ubuntu-latest. The ~4m55s recorded for v1.8.0 and v1.9.0 in
    # release-consistency.yml predates the suite's growth; no tag has run since,
    # so no duration is claimed for this workflow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The record check below walks from the recorded candidate to the tag.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # One commit, one candidate: the release footer's date is the commit's
      # (build/build.mjs reads SOURCE_DATE_EPOCH), as in ci.yml, so a rebuild of
      # the same commit is byte-identical.
      - name: pin the build date to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: tag must match package.json version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
      - name: record Chrome version
        run: '"$CHROME_BIN" --version >> "$GITHUB_STEP_SUMMARY"'
      # A tag on a commit whose ci.yml run is missing or red must not publish.
      # This runs before npm ci so a refused tag costs seconds, not a suite.
      - name: ci.yml must have succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "${found:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run exists for commit $GITHUB_SHA, so tag $GITHUB_REF_NAME cannot be released. Wait for ci.yml to go green on this commit (or fix it and tag the fixed commit), then re-run this workflow." >&2
            exit 1
          fi
          echo "ci.yml succeeded on $GITHUB_SHA"
      # The acceptance record must name this tag's candidate (the tag commit, or
      # an ancestor with only docs/ changed since) with no open agent-executable
      # row. Checked here so a stale record stops the tag before it publishes;
      # release-consistency.yml re-checks it after.
      - name: acceptance record must name this candidate
        run: node build/check-acceptance-record.mjs docs/release-acceptance-record.md "$GITHUB_SHA"
      - run: npm ci
      - run: npm test
        env:
          CI: true
      # npm test's posttest (package.json: posttest -> gate -> test:release) builds
      # dist/release/band-coach.html and runs tests/release/* against it, so the
      # release lane runs once, there. Record the hash of that exact file now;
      # publish refuses to upload anything else. Nothing may run between this
      # step, npm test and publish (tests/unit/release-workflow-budget-evidence
      # T3 pins it). Do not add a second `npm run gate`: it only repeats the lane.
      - name: record the hash of the file the release lane tested
        run: sha256sum dist/release/band-coach.html > "$RUNNER_TEMP/tested.sha256"
      - name: publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c "$RUNNER_TEMP/tested.sha256"
          # sha256sum format against the bare name, so `sha256sum -c` works in the
          # learner's download folder.
          (cd dist/release && sha256sum band-coach.html) > "$RUNNER_TEMP/band-coach.html.sha256"
          gh release create "$GITHUB_REF_NAME" dist/release/band-coach.html \
            "$RUNNER_TEMP/band-coach.html.sha256" \
            --title "Band Coach $GITHUB_REF_NAME" \
            --generate-notes
      # The file a learner downloads must be the gate's file and must still pass:
      # download it back, byte-compare, and re-run the gate plus one journey on
      # the download. A failure fails this run, so pages.yml and
      # store-package.yml (which wait for it) ship nothing and the site is not
      # notified; tests/unit/release-workflow-budget-evidence.test.mjs T7 pins it.
      - name: prove the downloaded release file
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          CI: true
          BAND_COACH_HTML: ${{ runner.temp }}/published/band-coach.html
        run: |
          gh release download "$GITHUB_REF_NAME" -p band-coach.html -D "$RUNNER_TEMP/published"
          cmp "$RUNNER_TEMP/published/band-coach.html" dist/release/band-coach.html
          node --test tests/release/gate.test.mjs tests/release/acceptance-first-visit.test.mjs
          gh release download "$GITHUB_REF_NAME" -p band-coach.html.sha256 -D "$RUNNER_TEMP/published"
          (cd "$RUNNER_TEMP/published" && sha256sum -c band-coach.html.sha256)
      # Signed build provenance for the exact file that was published and proved;
      # `gh attestation verify band-coach.html --repo Back-Road-Creative/band-coach`
      # checks a download against it. Needs id-token and attestations: write,
      # granted on this job only.
      - name: attest build provenance of the release file
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/band-coach.html
      # A dispatch run stops here: say what a tag run would have published.
      - name: summarise what a tag run would publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### Dry run: nothing was published or notified"
            echo "A tag push of this commit would publish dist/release/band-coach.html ($(wc -c < dist/release/band-coach.html) bytes) as the release asset, with this sha256:"
            echo '```'
            cat "$RUNNER_TEMP/tested.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: check for HEADLESSMODE_DISPATCH_TOKEN
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: headlessmode-token
        env:
          DISPATCH_TOKEN: ${{ secrets.HEADLESSMODE_DISPATCH_TOKEN }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: warn if the Headless Mode site will not be notified
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.headlessmode-token.outputs.present != 'true'
        run: echo "::warning::HEADLESSMODE_DISPATCH_TOKEN not set — site not notified; its daily poll picks the release up within 24h"
      - name: Notify the Headless Mode site
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.headlessmode-token.outputs.present == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HEADLESSMODE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api repos/Back-Road-Creative/headlessmode/dispatches \
            -f event_type=product-release \
            -F 'client_payload[product]=band-coach' \
            -F "client_payload[tag]=$TAG"
      - name: keep failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
