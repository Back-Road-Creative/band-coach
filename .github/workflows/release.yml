name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  # pages.yml and store-package.yml wait for this workflow's run on the same
  # commit to succeed (their release-gate job) before they deploy or package;
  # tests/unit/tag-deploys-wait-for-release-run.test.mjs pins that.
  release:
    runs-on: ubuntu-latest
    # This job runs the same two release-lane runs as ci.yml (here: the suite,
    # whose posttest runs the gate, then the gate again; ci.yml runs the gate
    # first), so its budget must stay at or above ci.yml's;
    # tests/unit/release-workflow-budget-evidence.test.mjs pins that, so a
    # later rise in ci.yml must be followed here. Ten passing
    # ci.yml runs of this work on 2026-10-02 took 12.9-15.0 min on
    # ubuntu-latest. The ~4m55s recorded for v1.8.0 and v1.9.0 in
    # release-consistency.yml predates the suite's growth; no tag has run since,
    # so no duration is claimed for this workflow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The record check below walks from the recorded candidate to the tag.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: tag must match package.json version
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
      - name: record Chrome version
        run: '"$CHROME_BIN" --version >> "$GITHUB_STEP_SUMMARY"'
      # A tag on a commit whose ci.yml run is missing or red must not publish.
      # This runs before npm ci so a refused tag costs seconds, not a suite.
      - name: ci.yml must have succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "${found:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run exists for commit $GITHUB_SHA, so tag $GITHUB_REF_NAME cannot be released. Wait for ci.yml to go green on this commit (or fix it and tag the fixed commit), then re-run this workflow." >&2
            exit 1
          fi
          echo "ci.yml succeeded on $GITHUB_SHA"
      # The acceptance record must name this tag's candidate (the tag commit, or
      # an ancestor with only docs/ changed since) with no open agent-executable
      # row. Checked here so a stale record stops the tag before it publishes;
      # release-consistency.yml re-checks it after.
      - name: acceptance record must name this candidate
        run: node build/check-acceptance-record.mjs docs/release-acceptance-record.md "$GITHUB_SHA"
      - run: npm ci
      - run: npm test
        env:
          CI: true
      # This step rebuilds the release file and tests it, so the file published
      # next is the gate's whether or not the suite ran its posttest. Publish
      # must follow it directly. Do not delete it without a replacement that
      # proves the same.
      - run: npm run gate
        env:
          CI: true
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/band-coach.html \
            --title "Band Coach $GITHUB_REF_NAME" \
            --generate-notes
      - name: check for HEADLESSMODE_DISPATCH_TOKEN
        id: headlessmode-token
        run: |
          if [ -n "${{ secrets.HEADLESSMODE_DISPATCH_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: warn if the Headless Mode site will not be notified
        if: steps.headlessmode-token.outputs.present != 'true'
        run: echo "::warning::HEADLESSMODE_DISPATCH_TOKEN not set — site not notified; its daily poll picks the release up within 24h"
      - name: Notify the Headless Mode site
        if: steps.headlessmode-token.outputs.present == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HEADLESSMODE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api repos/Back-Road-Creative/headlessmode/dispatches \
            -f event_type=product-release \
            -F 'client_payload[product]=band-coach' \
            -F "client_payload[tag]=$TAG"
      - name: keep failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
