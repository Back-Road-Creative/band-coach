name: ci

# A PR branch is proven by its `pull_request` run; `main` is proven by its own
# push run, which is what the autoland barrier reads on the integration head.
# Triggering push on every branch as well ran the whole suite TWICE per push,
# and because a push and a pull_request carry different `github.ref` the
# concurrency group below could not collapse them -- the two runs simply raced
# for the same shared box and lost to the then 10-minute job timeout.
#
# The job timeout is a budget over the MEASURED suite, not a target: ten
# passing runs on 2026-10-02 took 12.9-15.0 min on ubuntu-latest (14.7, 15.0,
# 14.3, 14.8, 14.9, 14.8, 14.9, 14.7, 12.9, 14.8). Those runs ran the whole
# release lane twice (every tests/release/ file, acceptance-* included, once as
# a first gate step and again as posttest), so the budget is 30 min. The first
# step now runs only gate.test.mjs and the full lane runs once, as posttest; the
# new duration is measured on a run, not claimed here.
# Earlier, three PR runs launched together were cancelled at 10m06s with
# nothing failing. tests/unit/ci-workflow-no-duplicate-run.test.mjs and
# ci-workflow-artifacts-weekly.test.mjs pin the headroom. A failed or
# cancelled run uploads dist/test-artifacts/ so its screenshots and logs
# survive. build/ci-summary.mjs turns the two step logs into a READY / NOT
# READY verdict and a run-summary artifact (retries, skips and cancellations
# in the release lane are visible, not hidden behind a green job). The weekly
# run on a fresh browser is a separate file (weekly-current-browser.yml):
# bin/autoland.py counts every ci.yml run on a commit whatever its event, so
# a scheduled run here would feed the merge barrier.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Depth 2: on a pull_request run HEAD is GitHub's merge commit, and HEAD^1
      # (the base) is what build/ci-select.mjs diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # One commit, one candidate: the release footer's date is the commit's, not
      # the wall clock (build/build.mjs reads SOURCE_DATE_EPOCH). On a pull_request
      # run the checked-out commit is GitHub's merge commit.
      - name: pin the build date to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: record Chrome version
        run: '"$CHROME_BIN" --version >> "$GITHUB_STEP_SUMMARY"'
      - run: npm ci
      # Cheap and decisive first (about 5 s): the size budget and the smoke checks
      # must not wait behind the browser suite. Only gate.test.mjs runs here; the
      # whole release lane runs once, as the suite step's posttest. Each of the two
      # steps keeps its exact exit code and log in $RUNNER_TEMP (outside dist/,
      # which pretest's dev build deletes) for build/ci-summary.mjs.
      - id: gate
        name: release size budget and smoke checks
        shell: bash
        env:
          CI: true
        run: |
          set +e
          { node build/build.mjs --release && node --test tests/release/gate.test.mjs; } 2>&1 | tee "$RUNNER_TEMP/gate.log"
          rc=${PIPESTATUS[0]}; echo "$rc" > "$RUNNER_TEMP/gate.rc"; exit "$rc"
      # A pull_request runs only the test families its changed files select
      # (build/ci-select.mjs + tests/families.json; unknown or empty selects
      # everything) and records the selection in $RUNNER_TEMP/selection.txt so
      # build/ci-summary.mjs can tell "release lane intentionally not run" from
      # "release lane missing". A push to main always runs the full `npm test`.
      - id: suite
        name: test families, then the release lane when selected
        shell: bash
        env:
          CI: true
        run: |
          set +e
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            sel=$(node build/ci-select.mjs --base HEAD^1)
            echo "$sel" > "$RUNNER_TEMP/selection.txt"
            {
              echo "selected test families: $sel"
              npm run build || exit 1
              fail=0
              for s in $sel; do npm run "$s" || fail=1; done
              exit "$fail"
            } 2>&1 | tee "$RUNNER_TEMP/suite.log"
            rc=${PIPESTATUS[0]}
          else
            npm test 2>&1 | tee "$RUNNER_TEMP/suite.log"
            rc=${PIPESTATUS[0]}
          fi
          echo "$rc" > "$RUNNER_TEMP/suite.rc"; exit "$rc"
      # NOT READY (a retry, skip, cancel or passing todo with a reason in the
      # release lane, or no release block at all) fails this step even when the
      # suite step went green.
      - name: summarise the run
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: node build/ci-summary.mjs
      - name: keep the run summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-artifacts/run-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: keep failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
