name: ci

# A PR branch is proven by its `pull_request` run; `main` is proven by its own
# push run, which is what the autoland barrier reads on the integration head.
# Triggering push on every branch as well ran the whole suite TWICE per push,
# and because a push and a pull_request carry different `github.ref` the
# concurrency group below could not collapse them -- the two runs simply raced
# for the same shared box and lost to the then 10-minute job timeout.
#
# The job timeout is a budget over the MEASURED suite, not a target: `npm test`
# took 8m21s-9m36s on ubuntu-latest for passing runs on 2026-09-28, and three
# PR runs launched together were cancelled at 10m06s with nothing failing.
# tests/unit/ci-workflow-no-duplicate-run.test.mjs pins the headroom.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
        env:
          CI: true
      - run: npm run gate
        env:
          CI: true
