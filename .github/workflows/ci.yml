name: ci

# Independent development and release jobs, then one required `test` verdict.
# Standard hosted jobs run only in public repositories. No paid runner/cache.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: select
        run: node build/ci-plan.mjs plan

  development:
    needs: plan
    if: github.event.repository.private == false && fromJSON(needs.plan.outputs.plan).development[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # One commit, one candidate: the release footer's date is the commit's, not
      # the wall clock (build/build.mjs reads SOURCE_DATE_EPOCH). On a pull_request
      # run the checked-out commit is GitHub's merge commit.
      - name: pin the build date to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: record Chrome version
        run: '"$CHROME_BIN" --version >> "$GITHUB_STEP_SUMMARY"'
      - run: npm ci
      # Cheap size/smoke gate first; each job owns its own dist/ and logs.
      - id: gate
        name: release size budget and smoke checks
        shell: bash
        env:
          CI: true
        run: |
          set +e
          { node build/build.mjs --release && node --test tests/release/gate.test.mjs; } 2>&1 | tee "$RUNNER_TEMP/gate.log"
          rc=${PIPESTATUS[0]}; echo "$rc" > "$RUNNER_TEMP/gate.rc"; exit "$rc"
      - id: suite
        name: selected development families
        shell: bash
        env:
          CI: true
          SELECTED: ${{ join(fromJSON(needs.plan.outputs.plan).development, ' ') }}
        run: |
          set +e
          echo "$SELECTED" > "$RUNNER_TEMP/selection.txt"
          {
            npm run build || exit 1
            fail=0
            if [ "$SELECTED" = "test:root test:build test:char test:unit" ]; then
              # Keep file scheduling across all development families. The
              # explicit build above replaces pretest; release has its own job.
              npm --ignore-scripts test || fail=1
            else
              for family in $SELECTED; do npm run "$family" || fail=1; done
            fi
            exit "$fail"
          } 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}; echo "$rc" > "$RUNNER_TEMP/suite.rc"; exit "$rc"
      - name: summarise the job
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: node build/ci-summary.mjs
      - id: report
        if: always()
        run: node build/ci-plan.mjs report
      - name: keep failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-artifacts/
          if-no-files-found: ignore
          retention-days: 1

  release:
    needs: plan
    if: github.event.repository.private == false && fromJSON(needs.plan.outputs.plan).release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # One commit, one candidate: the release footer's date is the commit's, not
      # the wall clock (build/build.mjs reads SOURCE_DATE_EPOCH). On a pull_request
      # run the checked-out commit is GitHub's merge commit.
      - name: pin the build date to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: record Chrome version
        run: '"$CHROME_BIN" --version >> "$GITHUB_STEP_SUMMARY"'
      - run: npm ci
      # Cheap size/smoke gate first; each job owns its own dist/ and logs.
      - id: gate
        name: release size budget and smoke checks
        shell: bash
        env:
          CI: true
        run: |
          set +e
          { node build/build.mjs --release && node --test tests/release/gate.test.mjs; } 2>&1 | tee "$RUNNER_TEMP/gate.log"
          rc=${PIPESTATUS[0]}; echo "$rc" > "$RUNNER_TEMP/gate.rc"; exit "$rc"
      - id: suite
        name: selected release acceptance
        shell: bash
        env:
          CI: true
        run: |
          set +e
          echo test:release > "$RUNNER_TEMP/selection.txt"
          npm run test:release 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}; echo "$rc" > "$RUNNER_TEMP/suite.rc"; exit "$rc"
      - name: summarise the job
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: node build/ci-summary.mjs
      - id: report
        if: always()
        run: node build/ci-plan.mjs report
      - name: keep failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-artifacts/
          if-no-files-found: ignore
          retention-days: 1

  test:
    needs: [plan, development, release]
    if: always() && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: require every selected job and candidate report
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          PLAN_RESULT: ${{ needs.plan.result }}
          DEVELOPMENT_RESULT: ${{ needs.development.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          DEVELOPMENT_REPORT: ${{ needs.development.outputs.report }}
          RELEASE_REPORT: ${{ needs.release.outputs.report }}
        run: node build/ci-plan.mjs aggregate
      - name: keep the run summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-artifacts/run-summary.json
          if-no-files-found: error
          retention-days: 7
