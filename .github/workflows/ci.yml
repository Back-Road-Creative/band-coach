name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
        env:
          CI: true
      - run: npm run gate
        env:
          CI: true
