# Keeps the SHA-pinned actions and both npm trees (the app and the Store
# packager) current. Weekly, so a pin is never more than a week behind.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/store"
    schedule:
      interval: "weekly"
