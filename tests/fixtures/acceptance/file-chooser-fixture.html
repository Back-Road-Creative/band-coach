<!doctype html>
<!-- Stand-in page for tests/unit/file-chooser.test.mjs. Not the app. -->
<html><head><meta charset="utf-8"><title>file chooser fixture</title>
<style>body{margin:20px}button,label{display:block;margin:12px 0}</style></head><body>
<label id="pick" for="file">Choose a recording</label>
<input id="file" type="file" hidden>
<button id="open" type="button">Open the chooser</button>
<button id="inert" type="button">Does nothing</button>
<script>
window.__picks = []; window.__clicks = 0;
var input = document.getElementById('file');
['input', 'change'].forEach(function (n) {
  input.addEventListener(n, function (e) { __picks.push(e.type + ':' + (input.files[0] ? input.files[0].name : '') + (e.isTrusted ? '' : ':synthetic')); });
});
document.addEventListener('click', function () { __clicks++; }, true);
document.getElementById('open').addEventListener('click', function () { input.click(); });
document.documentElement.setAttribute('data-coach-ready', '1');
</script></body></html>
